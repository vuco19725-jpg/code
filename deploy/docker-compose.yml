version: '3.8'

services:
  # MySQL
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=seckill
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - seckill-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - seckill-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 秒杀服务实例 1
  seckill-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SECKILL_ENV=prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - seckill-network

  # 秒杀服务实例 2
  seckill-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SECKILL_ENV=prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - seckill-network

  # 秒杀服务实例 3
  seckill-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - SECKILL_ENV=prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - seckill-network

  # Nginx 负载均衡
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web:/usr/share/nginx/html:ro
    depends_on:
      - seckill-1
      - seckill-2
      - seckill-3
    networks:
      - seckill-network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - seckill-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  qdrant-data:

networks:
  seckill-network:
    driver: bridge
